<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Free QR Code Generator built with HTML, CSS and JavaScript">

  <title>QR Code Generator | ANAND CODE LAB</title>

  <!-- QRCode.js -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #050816;
      --card: rgba(16, 24, 43, 0.88);
      --card2: rgba(255, 255, 255, 0.055);
      --border: rgba(255, 255, 255, 0.11);
      --text: #ffffff;
      --muted: #9ba8bd;
      --cyan: #00e5ff;
      --purple: #8b5cf6;
      --green: #39ff88;
      --danger: #ff5570;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(0,229,255,.13), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(139,92,246,.16), transparent 30%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      padding: 7px 13px;
      border: 1px solid rgba(0,229,255,.25);
      border-radius: 999px;
      color: var(--cyan);
      background: rgba(0,229,255,.06);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(30px, 7vw, 55px);
      line-height: 1;
      letter-spacing: 2px;
      background: linear-gradient(
        90deg,
        var(--cyan),
        #ffffff,
        var(--purple)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .header p {
      color: var(--muted);
      margin-top: 10px;
      font-size: 14px;
    }

    .app {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 24px;
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
    }

    .input-label {
      display: block;
      color: #dce5f5;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    textarea {
      width: 100%;
      min-height: 115px;
      resize: vertical;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 16px;
      padding: 16px;
      background: var(--card2);
      color: white;
      font-size: 15px;
      line-height: 1.5;
      transition: .25s;
    }

    textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 25px rgba(0,229,255,.10);
    }

    textarea::placeholder {
      color: #68758c;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 13px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: 800;
      border-radius: 13px;
      padding: 14px 16px;
      transition: .2s;
      font-size: 14px;
    }

    button:active {
      transform: scale(.97);
    }

    .generate {
      color: #001018;
      background: linear-gradient(
        135deg,
        var(--cyan),
        #7df7ff
      );
    }

    .sample {
      color: white;
      background: linear-gradient(
        135deg,
        rgba(139,92,246,.8),
        rgba(85,65,180,.8)
      );
    }

    .generate:hover,
    .sample:hover {
      transform: translateY(-2px);
    }

    .qr-section {
      display: none;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .qr-section.show {
      display: block;
      animation: show .45s ease;
    }

    @keyframes show {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .qr-title {
      text-align: center;
      font-size: 18px;
      margin-bottom: 16px;
    }

    .qr-wrapper {
      width: min(300px, 80vw);
      aspect-ratio: 1;
      margin: auto;
      padding: 15px;
      border-radius: 22px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 45px rgba(0,229,255,.16),
        0 20px 50px rgba(0,0,0,.35);
    }

    #qrcode {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img,
    #qrcode canvas {
      max-width: 100%;
      height: auto !important;
    }

    .encoded-text {
      margin: 17px auto;
      max-width: 600px;
      padding: 12px 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card2);
      color: var(--muted);
      font-size: 13px;
      word-break: break-word;
      text-align: center;
    }

    .qr-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .copy {
      color: white;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);
    }

    .download {
      color: #001018;
      background: var(--green);
    }

    .clear {
      color: white;
      background: rgba(255,85,112,.13);
      border: 1px solid rgba(255,85,112,.25);
    }

    .copy:hover,
    .download:hover,
    .clear:hover {
      transform: translateY(-2px);
    }

    .tips {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .tip {
      text-align: center;
      padding: 13px 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      border-radius: 14px;
    }

    .tip strong {
      display: block;
      color: white;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .tip span {
      color: var(--muted);
      font-size: 11px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translate(-50%, 30px);
      opacity: 0;
      pointer-events: none;
      background: #111827;
      border: 1px solid rgba(0,229,255,.25);
      color: white;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 13px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
      transition: .3s;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    footer {
      text-align: center;
      margin-top: 20px;
      color: #66738a;
      font-size: 12px;
      line-height: 1.7;
    }

    footer strong {
      color: var(--cyan);
    }

    @media (max-width: 600px) {
      body {
        padding: 13px;
      }

      .app {
        padding: 18px;
        border-radius: 21px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .qr-actions {
        grid-template-columns: 1fr;
      }

      .tips {
        grid-template-columns: 1fr;
      }

      .qr-wrapper {
        width: min(260px, 78vw);
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <div class="badge">ANAND CODE LAB</div>

      <h1>QR GENERATOR</h1>

      <p>
        Turn text, links and messages into QR codes instantly.
      </p>
    </header>

    <section class="app">

      <label class="input-label" for="textInput">
        ENTER TEXT OR URL
      </label>

      <textarea
        id="textInput"
        placeholder="Type something here...&#10;&#10;Example: https://example.com"
      ></textarea>

      <div class="actions">
        <button class="generate" id="generateBtn">
          ⚡ GENERATE QR
        </button>

        <button class="sample" id="sampleBtn">
          ✨ USE SAMPLE
        </button>
      </div>

      <section class="qr-section" id="qrSection">

        <h2 class="qr-title">
          Your QR Code is Ready 🚀
        </h2>

        <div class="qr-wrapper">
          <div id="qrcode"></div>
        </div>

        <div class="encoded-text" id="encodedText"></div>

        <div class="qr-actions">

          <button class="copy" id="copyBtn">
            📋 COPY TEXT
          </button>

          <button class="download" id="downloadBtn">
            ⬇️ DOWNLOAD
          </button>

          <button class="clear" id="clearBtn">
            🗑️ CLEAR
          </button>

        </div>

      </section>

      <div class="tips">

        <div class="tip">
          <strong>⚡ FAST</strong>
          <span>Generate instantly</span>
        </div>

        <div class="tip">
          <strong>📱 RESPONSIVE</strong>
          <span>Works on mobile</span>
        </div>

        <div class="tip">
          <strong>🔒 SIMPLE</strong>
          <span>No account required</span>
        </div>

      </div>

    </section>

    <footer>
      Built with
      <strong>HTML</strong> •
      <strong>CSS</strong> •
      <strong>JavaScript</strong>
      <br>
      ANAND CODE LAB • BUILD • CODE • CREATE 🚀
    </footer>

  </main>

  <div class="toast" id="toast"></div>

  <script>
    const textInput = document.getElementById("textInput");
    const generateBtn = document.getElementById("generateBtn");
    const sampleBtn = document.getElementById("sampleBtn");

    const qrSection = document.getElementById("qrSection");
    const qrContainer = document.getElementById("qrcode");
    const encodedText = document.getElementById("encodedText");

    const copyBtn = document.getElementById("copyBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const clearBtn = document.getElementById("clearBtn");

    const toast = document.getElementById("toast");

    let currentText = "";
    let qrCode = null;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function generateQR() {

      const text = textInput.value.trim();

      if (!text) {
        showToast("⚠️ Please enter some text first.");
        textInput.focus();
        return;
      }

      currentText = text;

      qrContainer.innerHTML = "";

      qrCode = new QRCode(qrContainer, {
        text: text,
        width: 260,
        height: 260,
        colorDark: "#050816",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      encodedText.textContent = text;

      qrSection.classList.add("show");

      setTimeout(() => {
        qrSection.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }, 100);

      showToast("✅ QR Code generated!");
    }

    async function copyText() {

      if (!currentText) {
        showToast("⚠️ Generate a QR code first.");
        return;
      }

      try {

        if (
          navigator.clipboard &&
          window.isSecureContext
        ) {
          await navigator.clipboard.writeText(currentText);
        } else {

          const textarea = document.createElement("textarea");

          textarea.value = currentText;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";

          document.body.appendChild(textarea);

          textarea.focus();
          textarea.select();

          document.execCommand("copy");

          textarea.remove();
        }

        showToast("📋 Text copied!");

      } catch (error) {
        showToast("❌ Could not copy text.");
      }
    }

    function downloadQR() {

      const canvas = qrContainer.querySelector("canvas");
      const image = qrContainer.querySelector("img");

      if (!canvas && !image) {
        showToast("⚠️ Generate a QR code first.");
        return;
      }

      let dataURL;

      if (canvas) {
        dataURL = canvas.toDataURL("image/png");
      } else {
        dataURL = image.src;
      }

      const link = document.createElement("a");

      link.href = dataURL;
      link.download = "anand-code-lab-qr.png";

      document.body.appendChild(link);
      link.click();
      link.remove();

      showToast("⬇️ QR Code downloaded!");
    }

    function clearQR() {

      textInput.value = "";
      currentText = "";

      qrContainer.innerHTML = "";

      qrSection.classList.remove("show");

      textInput.focus();

      showToast("🗑️ QR Code cleared.");
    }

    sampleBtn.addEventListener("click", () => {

      textInput.value =
        "https://anadverma956989936-lab.github.io/anand-hub/";

      generateQR();
    });

    generateBtn.addEventListener("click", generateQR);

    copyBtn.addEventListener("click", copyText);

    downloadBtn.addEventListener("click", downloadQR);

    clearBtn.addEventListener("click", clearQR);

    textInput.addEventListener("keydown", (event) => {

      if (
        event.key === "Enter" &&
        (event.ctrlKey || event.metaKey)
      ) {
        generateQR();
      }

    });

    // Demo QR on first load
    window.addEventListener("load", () => {

      textInput.value =
        "https://anadverma956989936-lab.github.io/anand-hub/";

      generateQR();

    });
  </script>

</body>
</html>
